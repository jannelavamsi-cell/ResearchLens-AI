[project]
name = "researchlens-ai"
version = "0.1.0"
description = "ResearchLens AI: Intelligent Research-Paper Analysis & Comparative Literature Review System"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests as requiring real external API keys / models",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"evaluation/generate_label_template.py" = ["E402"]

[tool.coverage.run]
source = ["core", "modules", "database"]
omit = ["tests/*"]
